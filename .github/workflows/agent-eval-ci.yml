name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Tests replace model calls with fakes; this only allows import-time client construction.
      AGENT_API_KEY: ci-test-key-not-used-for-network-calls

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-noto-cjk

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full test suite
        run: python -m pytest

      - name: Validate single-turn eval suite
        run: >
          python -m quality.eval.eval_stage2.run_eval
          quality/eval/eval_stage2/cases_single.yaml
          --validate-only
          -o quality/eval/eval_stage2/validation_single.jsonl

      - name: Validate multi-turn eval suite
        run: >
          python -m quality.eval.eval_stage2.run_eval
          quality/eval/eval_stage2/cases_multiturn_v2.yaml
          --validate-only
          -o quality/eval/eval_stage2/validation_multiturn.jsonl

      - name: Build Docker image
        run: docker build -t drainage-agent:${{ github.sha }} .

  online-agent-eval:
    if: github.event_name == 'workflow_dispatch'
    needs: deterministic-quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
      AGENT_BASE_URL: ${{ secrets.AGENT_BASE_URL }}
      AGENT_MODEL: ${{ secrets.AGENT_MODEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-noto-cjk

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify model secret
        run: |
          if [ -z "$AGENT_API_KEY" ]; then
            echo "::error::AGENT_API_KEY is required for the manually triggered online eval."
            exit 1
          fi

      - name: Run online Agent eval smoke cases
        run: >
          python -m quality.eval.eval_stage2.run_eval
          quality/eval/eval_stage2/cases_ci.yaml
          -o quality/eval/eval_stage2/results_ci.jsonl
          --auto-confirm

      - name: Run objective eval checker
        run: >
          python quality/eval/check.py
          --results quality/eval/eval_stage2/results_ci.jsonl
          --format text

      - name: Upload eval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online-agent-eval-${{ github.run_id }}
          path: |
            quality/eval/eval_stage2/results_ci.jsonl
            quality/eval/eval_stage2/results_ci_checks.json
          if-no-files-found: warn
          retention-days: 30
