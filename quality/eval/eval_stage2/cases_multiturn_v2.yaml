# Schema v2: multi-turn cases only test state that crosses turns.
- id: M001
  category: 指代消解
  scenario: 继承分析任务、替换点位并比较已有结果
  conversation_goal: 继承分析任务、替换点位并比较已有结果
  state_under_test: &id001
  - task
  - scope
  dimensions:
    operation: 指代和替换
    constraints: *id001
    state_change: 增量分析
    length: 短
    final_task: 比较
  setup:
    fixture: default
  expected:
    final_state: 最终状态与用户最后一次明确要求一致
    forbidden:
    - 编造数据
    - 静默放宽范围
    - 复用已经失效的结果
    evidence:
    - turns.expected
    - turns.trace_events
    - state.before
    - state.after
  turns:
  - prompt: 看 W1、W6 的旱天排污规律。
    key: true
    expected:
      tools:
        must_call:
        - analyze_patterns
        must_not_call: []
      arguments: points=[W1,W6]，旱天
      response: 返回 W1/W6 的旱天排污规律
      inherited: []
      replaced: []
      invalidated: []
      artifacts: 未明确要求时不产生交付文件
      forbidden: []
      evidence:
      - tool_calls
      - trace_events
      - state.before
      - state.after
  - prompt: 那 W4 呢？
    key: true
    expected:
      tools:
        must_call:
        - analyze_patterns
        must_not_call: []
      arguments: points=[W4]，仍为旱天排污规律
      response: 把那指代为排污规律，对 W4 做同类分析
      inherited:
      - task
      - dry_scope
      replaced:
      - points
      invalidated: []
      artifacts: 未明确要求时不产生交付文件
      forbidden:
      - 反问做什么分析
      - 扩展到全网
      evidence:
      - tool_calls
      - trace_events
      - state.before
      - state.after
  - prompt: W1 和 W4 比，哪个更异常？
    key: true
    expected:
      tools:
        must_call: []
        must_not_call:
        - analyze_patterns
      arguments: ''
      response: 基于已有 W1/W4 结果比较并给出依据
      inherited:
      - task
      - dry_scope
      replaced: []
      invalidated: []
      artifacts: 不产生新文件
      forbidden:
      - 重跑全网
      - 无依据排序
      evidence:
      - tool_calls
      - trace_events
      - state.before
      - state.after
- id: M002
  category: 增量分析与导出
  scenario: 继承点位和事件，追加模块并导出上述结果
  conversation_goal: 继承点位和事件，追加模块并导出上述结果
  state_under_test: &id002
  - points
  - event
  dimensions:
    operation: 追加和指代
    constraints: *id002
    state_change: 增量分析
    length: 短
    final_task: 导出
  setup:
    fixture: default
  expected:
    final_state: 最终状态与用户最后一次明确要求一致
    forbidden:
    - 编造数据
    - 静默放宽范围
    - 复用已经失效的结果
    evidence:
    - turns.expected
    - turns.trace_events
    - state.before
    - state.after
  turns:
  - prompt: 分析 W6 在第 6 场降雨里的事件响应。
    key: true
    expected:
      tools:
        must_call:
        - analyze_event_response
        must_not_call: []
      arguments: points=[W6], event_ids=[6]
      response: 返回 W6 事件6响应
      inherited: []
      replaced: []
      invalidated: []
      artifacts: 未明确要求时不产生交付文件
      forbidden: []
      evidence:
      - tool_calls
      - trace_events
      - state.before
      - state.after
  - prompt: 进一步分析 RDII 和雨天风险。
    key: true
    expected:
      tools:
        must_call:
        - analyze_rdii
        - assess_risk
        must_not_call: []
      arguments: points=[W6], event_ids=[6], scope=rainy
      response: 在相同点位和事件上追加 RDII 与雨天风险
      inherited:
      - points
      - event
      replaced: []
      invalidated: []
      artifacts: 未明确要求时不产生交付文件
      forbidden:
      - 改用其他事件
      - 扩展到全网
      evidence:
      - tool_calls
      - trace_events
      - state.before
      - state.after
  - prompt: 把上述结果导出。
    key: true
    expected:
      tools:
        must_call: []
        must_not_call: []
      arguments: ''
      response: 把上述指代为本会话 W6 事件6的三个模块结果
      inherited:
      - points
      - event
      - selected_results
      replaced: []
      invalidated: []
      artifacts: 只导出 W6 事件6相关结果
      forbidden:
      - 反问导出什么
      - 导出全网无关结果
      evidence:
      - tool_calls
      - trace_events
      - state.before
      - state.after
