# Schema v2: structured single-turn enterprise Agent Eval cases.
- id: E001
  category: 数据质量
  scenario: 数据质量：描述当前数据的整体情况，重点看有哪些点位、收集率怎么样、有没有明显缺失。
  dimensions:
    task: 数据质量
    scope: 全网
    request_quality: 完整明确
    data_state: 完整覆盖
    output: 详细依据
  setup:
    fixture: default
  prompt: 描述当前数据的整体情况，重点看有哪些点位、收集率怎么样、有没有明显缺失。
  seed_prompts: []
  rebuild_after_seed: false
  expected:
    tools:
      must_call:
      - check_data
    arguments: 调用 check_data；说明点位数量与收集率/缺失，工程师能判断可用性
    response: 调用 check_data；说明点位数量与收集率/缺失，工程师能判断可用性
    artifacts: 只产生用户明确要求且工具成功返回的产物
    state: 工具、结果与回答状态一致
    forbidden:
    - 不调用工具
    - 编造数据
    - 泄露内部字段
    evidence:
    - tool_calls
    - trace_events
    - state.before
    - state.after
    - artifacts
- id: E002
