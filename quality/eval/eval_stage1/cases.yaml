# 排水 agent eval 用例。agent 只看到 prompt；其余字段供你人工判分时对照。
- id: E001
  prompt: 描述当前数据的整体情况，重点看有哪些点位、收集率怎么样、有没有明显缺失。
  must_call: [check_data]
  must_not: [不调用工具, 编造数据, 泄露内部字段]
  pass_when: 调用 check_data；说明点位数量与收集率/缺失，工程师能判断可用性

- id: E002
  prompt: W1 这个点位的数据质量怎么样？有没有缺测或异常？
  must_call: [check_data]
  must_not: [回答全网却不单说 W1, 编造未返回指标]
  pass_when: check_data 参数含 W1；回答 W1 的收集率/缺失/异常

- id: E003
  prompt: 帮我统计 W1、W6、W18 的流量、液位、流速，默认看旱天。
  must_call: [data_filter, run_python]
  must_not: [漏任一点位, 把旱天当雨天, 只给泛泛描述]
  pass_when: 先调用 data_filter，再通过 run_python 的 load_filtered_flow 统计 W1/W6/W18，能比较三点统计量

- id: E004A
  prompt: 只看 W1 在 2026-02-01 到 2026-02-10 的流量均值和最大值。
  must_call: [run_python]
  must_not: [忽略时间范围, 查全网, 直接编数, 把3月数据当作2月数据]
  pass_when: 明确说明 W1 数据不覆盖该时间段，给出实际覆盖范围，不编造均值和最大值

- id: E004B
  prompt: 只看 W1 在 2026-03-08 到 2026-03-10 的流量均值和最大值。
  must_call: [run_python]
  must_not: [忽略时间范围, 查全网, 直接编数, 回答无数据]
  pass_when: 参数含 W1 与该时间段，返回有数据记录数、流量均值和最大值

- id: E005
  prompt: 这段数据里有哪些降雨事件？最大的一场是哪天？
  must_call: [analyze_rainfall]
  must_not: [不调降雨工具, 把雨日和事件混为一谈]
  pass_when: 回答事件数量与最大事件日期/雨量

- id: E006A
  prompt: W1 在 2 月 25 日到 2 月 26 日这场雨里的响应怎么样？
  must_call: [analyze_rainfall, analyze_event_response]
  must_not: [把日期当旱天统计, 跳过事件识别, 直接编峰值, 调用 run_python 重复验证]
  pass_when: 先识别为事件4，再明确 W1 监测数据与该事件无时间重叠，不编造响应指标

- id: E006B
  prompt: W1 在第 6 场降雨里的响应怎么样？
  must_call: [analyze_event_response]
  must_not: [改用其他事件, 回答无数据, 直接编峰值]
  pass_when: event_ids 含6且 points 含W1，返回最大液位、平均流量和峰值流量等响应指标

- id: E007A
  prompt: 比较 W1 和 W6 在第 4 场降雨中的响应差异。
  must_call: [analyze_event_response]
  must_not: [只分析一个点, 混淆事件编号, 编造响应指标, 调用 run_python 重复验证]
  pass_when: event_ids 含4且 points 含W1/W6，明确两点均无事件4期间的监测数据

- id: E007B
  prompt: 比较 W1 和 W6 在第 6 场降雨中的响应差异。
  must_call: [analyze_event_response]
  must_not: [只分析一个点, 混淆事件编号, 回答无数据, 没有比较]
  pass_when: event_ids 含6且 points 含W1/W6，给出两点响应指标与差异

- id: E008
  prompt: 帮我算一下 W1、W6 在第 6 场降雨里的 RDII，顺便说明谁更严重。
  must_call: [analyze_rdii]
  must_not: [不调 RDII 工具, 把峰值流量当 RDII, 不比较]
  pass_when: event 含 6，points 含 W1/W6，比较严重性

- id: E009A
  prompt: 给我看全部点位在第 4 场降雨中的 RDII 风险。
  must_call: [analyze_rdii]
  must_not: [只分析单点, 改用其他事件, 编造 RDII 或风险等级]
  pass_when: event_ids 含4，明确监测数据不覆盖该事件，无法计算 RDII

- id: E009B
  prompt: 给我看全部点位在第 6 场降雨中的 RDII 风险并排序。
  must_call: [analyze_rdii]
  must_not: [只分析单点, 改用其他事件, 回答无数据, 编造风险等级]
  pass_when: event_ids 含6并覆盖全网，给出 RDII 统计和风险排序依据

- id: E010
  prompt: 哪些点位有满管或溢流风险？请分旱天和雨天说，雨天重点看第 6 场降雨。
  must_call: [assess_risk]
  must_not: [混淆满管/超载/溢流, 只给一个总榜, 不说明场景]
  pass_when: 区分旱天风险与雨天风险，点明点位+场景+风险类型

- id: E011
  prompt: 第 6 场降雨中，W4 和 W6 的雨天溢流风险是不是比其他点更高？依据是什么？
  must_call: [assess_risk]
  must_not: [只说高/低不解释, 把旱天结论套到雨天]
  pass_when: 关注 W4/W6 雨天风险，说明依据指标

- id: E012
  prompt: 帮我比较 W1、W6、W18 的旱天排污规律，哪些像生活污水，哪些不像？
  must_call: [analyze_patterns]
  must_not: [漏点位, 只给分类不解释, 把雨天响应当旱天规律]
  pass_when: points 含 W1/W6/W18，解释分类依据，比较三点差异

- id: E013
  prompt: 全网哪些点位的旱天排污规律最异常？请给出优先排查顺序。
  must_call: [analyze_patterns]
  must_not: [只列随机点位, 不说明排序逻辑, 编造分类]
  pass_when: 覆盖全网，给出异常点位与排序依据

- id: E014
  prompt: 先检查数据，再分析降雨，再以第 6 场降雨为雨天场景给我一个风险总结，不用生成 Word 报告。
  must_call: [check_data, analyze_rainfall, assess_risk]
  must_not: [漏步骤, 调用 generate_report, 顺序混乱]
  pass_when: 依次走三步，不生成报告，最终是风险总结

- id: E015
  prompt: 以第 6 场降雨为重点，给我做一份包含 RDII 的完整分析报告。
  must_call: [data_filter, check_data, analyze_rainfall, analyze_event_response, analyze_patterns, analyze_rdii, assess_risk, generate_report]
  must_not: [漏掉第 6 场降雨, 漏 RDII, 未完成前置分析就生成报告, 报告路径不存在]
  pass_when: 完成完整分析链路，以事件 6 进行雨天响应、RDII 和风险分析，最终报告路径存在

- id: E016A
  prompt: 以第 4 场降雨为重点，生成包含响应、RDII 和风险的报告。
  must_call: [analyze_rainfall, analyze_event_response]
  must_not: [改用其他事件, 编造响应或 RDII, 生成缺少数据依据的报告, 未经覆盖验证宣称事件5或其他事件有流量监测数据]
  pass_when: 识别事件4与流量监测数据无时间重叠，明确无法完成可靠的响应、RDII和风险报告；不得把仅有降雨数据的事件5说成有流量监测覆盖

- id: E016B
  prompt: 以第 6 场降雨为重点，生成包含响应、RDII 和风险的报告。
  must_call: [analyze_event_response, analyze_rdii, assess_risk, generate_report]
  must_not: [只生成通用报告, 漏 RDII 或风险, 事件参数错, 报告路径不存在]
  pass_when: 各雨天工具及 generate_report 均使用事件6，回答说明包含响应、RDII和风险，报告路径存在

- id: E017
  prompt: 你直接告诉我 W999 的数据质量怎么样。
  must_call: [check_data]
  must_not: [编造 W999 指标, 静默改成其他点位]
  pass_when: 明确指出 W999 不存在/无数据，不编造

- id: E018A
  prompt: 分析一下"那个最大雨"里 W1 的响应。
  must_call: [analyze_rainfall, analyze_event_response]
  must_not: [随便选事件, 不说明"最大雨"是哪一场, 编造 W1 响应, 调用 run_python 重复验证]
  pass_when: 先识别最大雨为事件4，再明确 W1 数据不覆盖该事件，不能计算响应

- id: E018B
  prompt: 数据覆盖范围内雨量最大的降雨事件是哪一场？分析 W1 在其中的响应。
  must_call: [analyze_rainfall, analyze_event_response]
  must_not: [选择无监测覆盖的事件, 不说明事件编号, 回答无数据]
  pass_when: 识别有监测覆盖的最大雨为事件6，再给出 W1 的关键响应指标

- id: E019
  prompt: 我想知道哪里最危险，雨天按第 6 场降雨判断，其他口径你自己确定。
  must_call: [assess_risk]
  must_not: [口径不明, 只给主观结论, 不调用工具]
  pass_when: 说明"危险"的定义口径，给出点位与原因

- id: E020
  prompt: 先列出现有结果，如果已有结果是 fresh 就不要重复跑；如果没有，再补必要分析。
  seed_prompts:
    - 统计全网旱天的流量、液位、流速。   # 先造一个 fresh 结果，才能真正测"复用"
  must_call: [list_results]
  must_not: [不查现有结果直接重跑, 误用过期结果]
  pass_when: 先 list_results；据 fresh 状态复用或补跑，不盲目重跑
