<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drainage Agent</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --border: #d8dee8;
      --text: #20242c;
      --muted: #657080;
      --primary: #176b87;
      --primary-dark: #0f5268;
      --soft: #edf6f8;
      --danger: #a63d40;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .app {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      min-height: 100vh;
    }
    aside {
      border-right: 1px solid var(--border);
      background: var(--panel);
      padding: 18px;
      overflow: auto;
    }
    main {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-width: 0;
      min-height: 100vh;
    }
    header {
      padding: 18px 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 650;
    }
    h2 {
      margin: 20px 0 10px;
      font-size: 15px;
    }
    .sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }
    label {
      display: block;
      margin: 10px 0 6px;
      font-size: 13px;
      color: var(--muted);
    }
    input[type="file"] {
      width: 100%;
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 6px;
      background: #fff;
      font-size: 12px;
    }
    input[type="text"] {
      width: 100%;
      border: 1px solid var(--border);
      padding: 9px;
      border-radius: 6px;
      background: #fff;
      font: inherit;
    }
    button {
      border: 1px solid var(--primary);
      background: var(--primary);
      color: white;
      border-radius: 6px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: var(--primary-dark); }
    button.secondary {
      background: white;
      color: var(--primary);
    }
    button.secondary:hover {
      background: var(--soft);
    }
    .upload-btn { width: 100%; margin-top: 14px; }
    .quick {
      display: grid;
      gap: 8px;
    }
    .project-list,
    .batch-list {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }
    .project-list button,
    .batch-list button {
      width: 100%;
      text-align: left;
    }
    .chat {
      padding: 22px 24px;
      overflow: auto;
    }
    .msg {
      max-width: 920px;
      margin: 0 0 14px;
      padding: 12px 14px;
      border-radius: 8px;
      line-height: 1.55;
      border: 1px solid var(--border);
    }
    .msg.user {
      margin-left: auto;
      background: #eaf3f7;
      border-color: #c8e2eb;
      white-space: pre-wrap;
    }
    .msg.agent {
      background: var(--panel);
    }
    .msg.agent > *:first-child { margin-top: 0; }
    .msg.agent > *:last-child { margin-bottom: 0; }
    .msg.agent h1,
    .msg.agent h2,
    .msg.agent h3,
    .msg.agent h4,
    .msg.agent h5,
    .msg.agent h6 {
      margin: 14px 0 8px;
      font-size: 16px;
      line-height: 1.35;
    }
    .msg.agent p {
      margin: 8px 0;
    }
    .msg.agent ul {
      margin: 8px 0;
      padding-left: 22px;
    }
    .msg.agent li {
      margin: 3px 0;
    }
    .msg.agent table {
      width: 100%;
      margin: 10px 0;
      border-collapse: collapse;
      font-size: 14px;
    }
    .msg.agent th,
    .msg.agent td {
      border: 1px solid var(--border);
      padding: 7px 8px;
      text-align: left;
      vertical-align: top;
    }
    .msg.agent th {
      background: var(--soft);
      font-weight: 650;
    }
    .msg.agent code {
      padding: 1px 4px;
      border-radius: 4px;
      background: #eef1f5;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.92em;
    }
    .msg.agent hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 14px 0;
    }
    .composer {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    textarea {
      min-height: 46px;
      max-height: 160px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font: inherit;
    }
    .status {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      min-height: 18px;
    }
    .status.error { color: var(--danger); }
    .files {
      display: grid;
      gap: 6px;
      margin-top: 8px;
      font-size: 13px;
    }
    .files a {
      color: var(--primary);
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    .files a:hover { text-decoration: underline; }
    .inspection {
      margin-top: 10px;
      overflow-x: auto;
      font-size: 12px;
    }
    .inspection table {
      width: 100%;
      border-collapse: collapse;
    }
    .inspection th,
    .inspection td {
      border: 1px solid var(--border);
      padding: 6px;
      text-align: left;
    }
    .inspection select,
    .inspection input {
      width: 100%;
      min-width: 90px;
    }
    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--border); }
      main { min-height: 70vh; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>Drainage Agent</h1>
      <div class="sub">本地排水监测数据分析网页</div>

      <h2>监测项目</h2>
      <form id="projectForm">
        <label for="projectName">项目名称</label>
        <input id="projectName" name="name" type="text" required maxlength="120">
        <button class="upload-btn" type="submit">创建并切换</button>
      </form>
      <div id="projectStatus" class="status">当前项目：未选择</div>
      <div id="projectList" class="project-list"></div>

      <h2>分析批次</h2>
      <form id="batchForm">
        <label for="batchName">批次名称</label>
        <input id="batchName" name="name" type="text" required maxlength="120">
        <button id="createBatchButton" class="upload-btn" type="submit" disabled>创建并切换</button>
      </form>
      <div id="batchStatus" class="status">当前批次：未选择</div>
      <div id="batchList" class="batch-list"></div>

      <h2>批次标准数据</h2>
      <form id="importProfileForm">
        <label for="importProfileName">导入配置名称</label>
        <input id="importProfileName" type="text" maxlength="120">
        <label for="importSourceIdentifier">数据来源标识</label>
        <input id="importSourceIdentifier" type="text" maxlength="120">
        <button id="saveImportProfile" type="button" disabled>保存当前映射配置</button>
      </form>
      <form id="batchImportForm">
        <label for="importProfileSelect">复用导入配置</label>
        <select id="importProfileSelect"><option value="">不使用配置</option></select>
        <label for="batchImportFile">原始监测 CSV</label>
        <input id="batchImportFile" name="file" type="file" accept=".csv" required>
        <button id="batchImportButton" class="upload-btn" type="submit" disabled>上传并识别</button>
      </form>
      <div id="batchImportStatus" class="status">请先选择分析批次。</div>
      <div id="importInspection" class="inspection">
        编码、字段、类型、单位和异常将在上传后显示。
      </div>
      <div id="standardPreview" class="inspection">标准数据预览尚未生成。</div>

      <h2>筛选确认与分析基线</h2>
      <button id="runFilterButton" class="upload-btn" type="button" disabled>
        运行自动筛选
      </button>
      <div id="filterSummary" class="inspection">请先生成并确认标准数据。</div>
      <label for="filterRevisionFile">修改后的筛选文件</label>
      <input id="filterRevisionFile" type="file" accept=".xlsx" disabled>
      <button id="uploadFilterRevisionButton" type="button" disabled>
        上传修改版本并校验
      </button>
      <button id="confirmFilterButton" class="upload-btn" type="button" disabled>
        明确确认当前筛选文件
      </button>

      <h2>数据质量检查</h2>
      <label class="check">
        <input id="forceDataQualityRerun" type="checkbox">
        明确重新运行并创建新版本
      </label>
      <button id="runDataQualityButton" class="upload-btn" type="button" disabled>
        运行数据质量检查
      </button>
      <div id="dataQualityResult" class="inspection">请先选择已有标准数据的分析批次。</div>
      <div id="analysisJobHistory" class="inspection">当前批次暂无后台作业。</div>

      <h2>派生分析批次</h2>
      <form id="derivedBatchForm">
        <label for="derivedBatchName">派生批次名称</label>
        <input id="derivedBatchName" name="name" type="text" required maxlength="120">
        <label>选择至少两个来源批次</label>
        <div id="derivedBatchSources" class="batch-list">请先选择监测项目。</div>
        <button class="upload-btn" type="submit">创建派生批次</button>
      </form>
      <div id="derivedBatchStatus" class="status"></div>
      <div id="derivedConflictPanel" class="status" hidden></div>

      <h2>上传数据</h2>
      <form id="uploadForm">
        <label>流量 CSV（可多选）</label>
        <input name="flow_files" type="file" accept=".csv" multiple>
        <label>降雨 CSV</label>
        <input name="rainfall_file" type="file" accept=".csv">
        <label>点位信息 XLSX</label>
        <input name="site_info_file" type="file" accept=".xlsx,.xlsm,.xls">
        <label>报告模板 DOCX</label>
        <input name="template_file" type="file" accept=".docx">
        <button class="upload-btn" type="submit">上传并标记旧结果过期</button>
      </form>
      <div id="uploadStatus" class="status"></div>

      <h2>快捷指令</h2>
      <div class="quick">
        <button class="secondary" data-prompt="描述当前数据">描述当前数据</button>
        <button class="secondary" data-prompt="统计数据收集率">统计数据收集率</button>
        <button class="secondary" data-prompt="只看降雨场次">只看降雨场次</button>
        <button class="secondary" data-prompt="分析旱天风险">分析旱天风险</button>
        <button class="secondary" data-prompt="列出已有结果">列出已有结果</button>
      </div>

      <h2>结果文件</h2>
      <button class="secondary" id="refreshResults" type="button">刷新列表</button>
      <div id="files" class="files"></div>

      <h2>Agent 运行记录</h2>
      <label class="check">
        <input id="deepDebug" type="checkbox">
        开启受控深度调试
      </label>
      <button class="secondary" id="refreshAgentRuns" type="button">刷新运行记录</button>
      <div id="agentRuns" class="inspection">请先选择分析批次。</div>
    </aside>

    <main>
      <header>
        <h1>对话分析</h1>
        <div class="sub">上传数据后，直接描述要做的分析。</div>
      </header>
      <section id="chat" class="chat">
        <div class="msg agent">已就绪。可以先点“描述当前数据”。</div>
      </section>
      <form id="chatForm" class="composer">
        <textarea id="message" placeholder="例如：只看 3 月 7 日这场雨的场次统计"></textarea>
        <button id="sendBtn" type="submit">发送</button>
      </form>
    </main>
  </div>

  <script>
    const sessionStorageKey = "drainage-agent-session";
    const latestChatStorageKey = "drainage-agent-chat-latest";
    let sessionId = localStorage.getItem(sessionStorageKey) || "";
    const chat = document.getElementById("chat");
    const message = document.getElementById("message");
    const uploadStatus = document.getElementById("uploadStatus");
    const files = document.getElementById("files");
    const projectStatus = document.getElementById("projectStatus");
    const projectList = document.getElementById("projectList");
    const batchStatus = document.getElementById("batchStatus");
    const batchList = document.getElementById("batchList");
    const createBatchButton = document.getElementById("createBatchButton");
    const batchImportButton = document.getElementById("batchImportButton");
    const batchImportStatus = document.getElementById("batchImportStatus");
    const importInspection = document.getElementById("importInspection");
    const standardPreview = document.getElementById("standardPreview");
    const importProfileSelect = document.getElementById("importProfileSelect");
    const runDataQualityButton = document.getElementById("runDataQualityButton");
    const forceDataQualityRerun = document.getElementById("forceDataQualityRerun");
    const dataQualityResult = document.getElementById("dataQualityResult");
    const runFilterButton = document.getElementById("runFilterButton");
    const filterSummary = document.getElementById("filterSummary");
    const filterRevisionFile = document.getElementById("filterRevisionFile");
    const uploadFilterRevisionButton = document.getElementById("uploadFilterRevisionButton");
    const confirmFilterButton = document.getElementById("confirmFilterButton");
    const analysisJobHistory = document.getElementById("analysisJobHistory");
    const agentRuns = document.getElementById("agentRuns");
    const deepDebug = document.getElementById("deepDebug");
    const welcomeMessage = "已就绪。可以先点“描述当前数据”。";
    let currentProjectId = "";
    let currentBatchId = "";
    let currentInspection = null;
    let currentFilterId = "";
    const derivedBatchSources = document.getElementById("derivedBatchSources");
    const derivedBatchStatus = document.getElementById("derivedBatchStatus");
    const derivedConflictPanel = document.getElementById("derivedConflictPanel");
    let availableBatches = [];
    let pendingDerivedRequest = null;

    function createSessionId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID().replaceAll("-", "");
      }
      return `${Date.now()}${Math.random().toString(16).slice(2)}`;
    }

    function chatStorageKey() {
      return sessionId ? `drainage-agent-chat-${sessionId}` : "";
    }

    function parseStoredTranscript(raw) {
      try {
        const value = JSON.parse(raw || "[]");
        if (Array.isArray(value)) {
          return {session_id: "", messages: value};
        }
        if (value && Array.isArray(value.messages)) {
          return {
            session_id: typeof value.session_id === "string" ? value.session_id : "",
            messages: value.messages,
          };
        }
      } catch {
        return {session_id: "", messages: []};
      }
      return {session_id: "", messages: []};
    }

    function loadTranscript() {
      const key = chatStorageKey();
      const sessionTranscript = key ? parseStoredTranscript(localStorage.getItem(key)).messages : [];
      if (sessionTranscript.length > 0) {
        return sessionTranscript;
      }

      const latest = parseStoredTranscript(localStorage.getItem(latestChatStorageKey));
      if (latest.session_id && !sessionId) {
        sessionId = latest.session_id;
        localStorage.setItem(sessionStorageKey, sessionId);
      }
      return latest.messages;
    }

    function saveTranscript(messages) {
      const payload = JSON.stringify({session_id: sessionId, messages});
      const key = chatStorageKey();
      if (key) {
        localStorage.setItem(key, payload);
      }
      localStorage.setItem(latestChatStorageKey, payload);
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function renderInlineMarkdown(text) {
      return escapeHtml(text)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function splitTableRow(line) {
      return line
        .trim()
        .replace(/^\|/, "")
        .replace(/\|$/, "")
        .split("|")
        .map((cell) => cell.trim());
    }

    function isTableSeparator(line) {
      const cells = splitTableRow(line);
      return cells.length > 1 && cells.every((cell) => /^:?-{3,}:?$/.test(cell));
    }

    function isBlockStart(line, nextLine = "") {
      const trimmed = line.trim();
      return (
        !trimmed ||
        /^#{1,6}\s+/.test(trimmed) ||
        /^-{3,}$/.test(trimmed) ||
        /^-\s+/.test(trimmed) ||
        (trimmed.startsWith("|") && isTableSeparator(nextLine))
      );
    }

    function appendHtml(parent, tagName, html) {
      const element = document.createElement(tagName);
      element.innerHTML = html;
      parent.appendChild(element);
      return element;
    }

    function renderMarkdown(text) {
      const fragment = document.createDocumentFragment();
      const lines = text.split(/\r?\n/);
      let index = 0;

      while (index < lines.length) {
        const line = lines[index];
        const trimmed = line.trim();
        const nextLine = lines[index + 1] || "";

        if (!trimmed) {
          index += 1;
          continue;
        }

        const heading = trimmed.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          appendHtml(fragment, `h${Math.min(heading[1].length, 6)}`, renderInlineMarkdown(heading[2]));
          index += 1;
          continue;
        }

        if (/^-{3,}$/.test(trimmed)) {
          fragment.appendChild(document.createElement("hr"));
          index += 1;
          continue;
        }

        if (trimmed.startsWith("|") && isTableSeparator(nextLine)) {
          const table = document.createElement("table");
          const thead = document.createElement("thead");
          const headerRow = document.createElement("tr");
          splitTableRow(line).forEach((cell) => appendHtml(headerRow, "th", renderInlineMarkdown(cell)));
          thead.appendChild(headerRow);
          table.appendChild(thead);

          const tbody = document.createElement("tbody");
          index += 2;
          while (index < lines.length && lines[index].trim().startsWith("|")) {
            const row = document.createElement("tr");
            splitTableRow(lines[index]).forEach((cell) => appendHtml(row, "td", renderInlineMarkdown(cell)));
            tbody.appendChild(row);
            index += 1;
          }
          table.appendChild(tbody);
          fragment.appendChild(table);
          continue;
        }

        if (/^-\s+/.test(trimmed)) {
          const list = document.createElement("ul");
          while (index < lines.length && /^-\s+/.test(lines[index].trim())) {
            appendHtml(list, "li", renderInlineMarkdown(lines[index].trim().replace(/^-\s+/, "")));
            index += 1;
          }
          fragment.appendChild(list);
          continue;
        }

        const paragraph = [];
        while (index < lines.length && !isBlockStart(lines[index], lines[index + 1] || "")) {
          paragraph.push(lines[index].trim());
          index += 1;
        }
        appendHtml(fragment, "p", paragraph.map(renderInlineMarkdown).join("<br>"));
      }

      return fragment;
    }

    function addMessage(text, role, persist = true) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      if (role === "agent") {
        div.appendChild(renderMarkdown(text));
      } else {
        div.textContent = text;
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      if (persist) {
        const transcript = loadTranscript();
        transcript.push({role, text});
        saveTranscript(transcript);
      }
    }

    function restoreTranscript() {
      const transcript = loadTranscript();
      chat.innerHTML = "";
      if (transcript.length === 0) {
        addMessage(welcomeMessage, "agent", false);
        return;
      }
      transcript.forEach((item) => {
        if (item && typeof item.text === "string" && ["user", "agent"].includes(item.role)) {
          addMessage(item.text, item.role, false);
        }
      });
    }

    async function send(text) {
      const trimmed = text.trim();
      if (!trimmed) return;
      if (!sessionId) {
        sessionId = createSessionId();
        localStorage.setItem(sessionStorageKey, sessionId);
      }
      addMessage(trimmed, "user");
      message.value = "";
      document.getElementById("sendBtn").disabled = true;
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            message: trimmed,
            session_id: sessionId || null,
            project_id: currentProjectId || null,
            batch_id: currentBatchId || null,
            debug: deepDebug.checked
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "请求失败");
        if (data.session_id !== sessionId) {
          sessionId = data.session_id;
          saveTranscript(loadTranscript());
        }
        localStorage.setItem(sessionStorageKey, sessionId);
        addMessage(data.reply, "agent");
        refreshResults();
        loadAgentRuns();
      } catch (err) {
        addMessage(`请求失败：${err.message}`, "agent");
      } finally {
        document.getElementById("sendBtn").disabled = false;
      }
    }

    document.getElementById("chatForm").addEventListener("submit", (event) => {
      event.preventDefault();
      send(message.value);
    });

    message.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        send(message.value);
      }
    });

    document.querySelectorAll("[data-prompt]").forEach((button) => {
      button.addEventListener("click", () => send(button.dataset.prompt));
    });

    async function selectProject(project) {
      const res = await fetch(`/api/projects/${project.id}/selection`, {method: "PUT"});
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "切换项目失败");
      currentProjectId = data.current_project.id;
      currentBatchId = "";
      projectStatus.textContent = `当前项目：${data.current_project.name}`;
      batchStatus.textContent = "当前批次：未选择";
      createBatchButton.disabled = false;
      batchImportButton.disabled = true;
      runDataQualityButton.disabled = true;
      runFilterButton.disabled = true;
      filterRevisionFile.disabled = true;
      uploadFilterRevisionButton.disabled = true;
      confirmFilterButton.disabled = true;
      currentFilterId = "";
      filterSummary.textContent = "请先生成并确认标准数据。";
      dataQualityResult.textContent = "请先选择已有标准数据的分析批次。";
      currentInspection = null;
      await refreshProjects();
      await loadImportProfiles();
      await refreshBatches();
    }

    async function refreshProjects() {
      const res = await fetch("/api/projects");
      const projects = await res.json();
      projectList.innerHTML = "";
      if (projects.length === 0) {
        projectList.textContent = "暂无监测项目。";
        return;
      }
      projects.forEach((project) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = project.id === currentProjectId ? "" : "secondary";
        button.textContent = project.name;
        button.title = "查看并切换到此项目";
        button.addEventListener("click", () => selectProject(project));
        projectList.appendChild(button);
      });
    }

    async function selectBatch(batch) {
      const res = await fetch(
        `/api/projects/${currentProjectId}/batches/${batch.id}/selection`,
        {method: "PUT"},
      );
      const data = await res.json();

      filterRevisionFile.disabled = true;

    async function loadAgentRuns() {
      if (!currentProjectId || !currentBatchId) {
        agentRuns.textContent = "请先选择分析批次。";
        return;
      }
      const res = await fetch(
        `/api/projects/${currentProjectId}/batches/${currentBatchId}/agent-runs`
      );
      const runs = await res.json();
      if (!res.ok) throw new Error(runs.detail || "读取 Agent 运行记录失败");
      if (runs.length === 0) {
        agentRuns.textContent = "当前批次暂无 Agent 运行记录。";
        return;
      }
      const table = document.createElement("table");
      table.innerHTML = "<thead><tr><th>时间</th><th>状态</th><th>模型</th><th>耗时</th><th>Token</th></tr></thead>";
      const body = document.createElement("tbody");
      runs.forEach((run) => {
        const row = document.createElement("tr");
        const token = run.total_tokens == null ? "—" : String(run.total_tokens);
        const duration = run.duration_ms == null ? "—" : `${run.duration_ms} ms`;
        row.innerHTML = `<td>${escapeHtml(run.started_at)}</td><td>${escapeHtml(run.status)}</td><td>${escapeHtml(run.model)}</td><td>${duration}</td><td>${token}</td>`;
        row.title = `run_id: ${run.run_id}`;
        body.appendChild(row);
      });

    document.getElementById("refreshAgentRuns").addEventListener("click", () => {
      loadAgentRuns().catch((err) => {

    async function refreshBatches() {
      batchList.innerHTML = "";
      derivedBatchSources.innerHTML = "";
      if (!currentProjectId) {
        batchList.textContent = "请先选择监测项目。";
        derivedBatchSources.textContent = "请先选择监测项目。";
        return;
      }
      const res = await fetch(`/api/projects/${currentProjectId}/batches`);
      const batches = await res.json();
      if (!res.ok) throw new Error(batches.detail || "读取分析批次失败");
      availableBatches = batches;
      if (batches.length === 0) {
        batchList.textContent = "暂无分析批次。";
        derivedBatchSources.textContent = "暂无可选来源批次。";
        return;
      }
      batches.forEach((batch) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = batch.id === currentBatchId ? "" : "secondary";
        button.textContent = batch.name;
        button.title = "查看并切换到此分析批次";
        button.addEventListener("click", () => selectBatch(batch));
        batchList.appendChild(button);

        const sourceLabel = document.createElement("label");
        const sourceCheckbox = document.createElement("input");
        sourceCheckbox.type = "checkbox";
        sourceCheckbox.name = "source_batch_ids";
        sourceCheckbox.value = batch.id;
        sourceLabel.append(sourceCheckbox, ` ${batch.name}`);
        derivedBatchSources.appendChild(sourceLabel);
      });
    }

    function showDerivedConflicts(payload) {
      const summary = payload.conflicts;
      derivedBatchStatus.className = "status error";
      derivedBatchStatus.textContent =
        `发现 ${summary.count} 处冲突，点位 ${summary.point_ids.join("、")}，` +
        `时间范围 ${summary.time_start} 至 ${summary.time_end}。请选择每处冲突的来源。`;
      derivedConflictPanel.hidden = false;
      derivedConflictPanel.innerHTML = "";
      payload.conflict_items.forEach((item, index) => {
        const label = document.createElement("label");
        label.textContent = `${item.point_id} / ${item.timestamp}（${item.kind}）`;
        const select = document.createElement("select");
        select.dataset.pointId = item.point_id;
        select.dataset.timestamp = item.timestamp;
        item.source_batch_ids.forEach((sourceId) => {
          const option = document.createElement("option");
          option.value = sourceId;
          option.textContent =
            availableBatches.find((batch) => batch.id === sourceId)?.name || sourceId;
          select.appendChild(option);
        });
        label.appendChild(select);
        derivedConflictPanel.appendChild(label);
      });
      const completeButton = document.createElement("button");
      completeButton.type = "button";
      completeButton.textContent = "按所选来源完成合并";
      completeButton.addEventListener("click", completeDerivedConflictMerge);
      derivedConflictPanel.appendChild(completeButton);
    }

    async function submitDerivedBatch(request) {
      const res = await fetch(`/api/projects/${currentProjectId}/derived-batches`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(request),
      });
      const data = await res.json();
      if (res.status === 409) {
        pendingDerivedRequest = request;
        showDerivedConflicts(data);
        return;
      }
      if (!res.ok) throw new Error(data.detail || "创建派生分析批次失败");
      pendingDerivedRequest = null;
      derivedConflictPanel.hidden = true;
      derivedBatchStatus.className = "status";
      derivedBatchStatus.textContent = `已创建派生批次：${data.name}`;
      document.getElementById("derivedBatchForm").reset();
      await refreshBatches();
    }

    async function completeDerivedConflictMerge() {
      if (!pendingDerivedRequest) return;
      const conflict_resolutions = Array.from(
        derivedConflictPanel.querySelectorAll("select"),
      ).map((select) => ({
        point_id: select.dataset.pointId,
        timestamp: select.dataset.timestamp,
        source_batch_id: select.value,
      }));
      try {
        await submitDerivedBatch({...pendingDerivedRequest, conflict_resolutions});
      } catch (err) {
        derivedBatchStatus.className = "status error";
        derivedBatchStatus.textContent = err.message;
      }
    }

    function inspectionTable(columns) {
      const fields = ["timestamp", "device_id", "point_id", "flow_lps", "level_m", "velocity_mps"];
      const rows = columns.map((column) => {
        const options = [
          `<option value="" ${column.field ? "" : "selected"}>未映射 / 忽略</option>`,
          ...fields.map((field) =>
          `<option value="${field}" ${field === column.field ? "selected" : ""}>${field}</option>`
          ),
        ].join("");
        return `<tr data-source="${escapeHtml(column.source)}">
          <td>${escapeHtml(column.source)}</td>
          <td><select data-role="field">${options}</select></td>
          <td>${escapeHtml(column.type)}</td>
          <td><input data-role="unit" value="${escapeHtml(column.unit || "")}" placeholder="确认源单位"></td>
        </tr>`;
      }).join("");
      return `<table><thead><tr><th>字段</th><th>规范字段</th><th>类型</th><th>单位</th></tr></thead>
        <tbody>${rows}</tbody></table>`;
    }

    function renderInspection(inspection) {
      currentInspection = inspection;
      const anomalies = inspection.anomalies.length
        ? `<p><strong>异常：</strong>${inspection.anomalies.map(escapeHtml).join("；")}</p>`
        : "<p>异常：无</p>";
      importInspection.innerHTML = `<p>编码：${escapeHtml(inspection.encoding)}；数据行：${inspection.row_count}</p>
        ${inspectionTable(inspection.columns)}${anomalies}
        <button id="suggestImportMapping" type="button">获取 LLM 候选映射</button>
        <button id="confirmImportMapping" type="button">确认映射并生成标准数据</button>`;
      document.getElementById("suggestImportMapping").addEventListener("click", suggestImportMapping);
      document.getElementById("confirmImportMapping").addEventListener("click", confirmImportMapping);
      document.getElementById("saveImportProfile").disabled = false;
      if (inspection.standard_preview) renderStandardPreview(inspection.standard_preview);
    }

    async function suggestImportMapping() {
      const res = await fetch(
        `/api/projects/${currentProjectId}/batches/${currentBatchId}/imports/${currentInspection.id}/mapping-suggestions`,
        {method: "POST"},
      );
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "获取候选映射失败");
      data.candidates.forEach((candidate) => {
        const row = [...importInspection.querySelectorAll("tbody tr")]
          .find((item) => item.dataset.source === candidate.source);
        if (row) row.querySelector('[data-role="field"]').value = candidate.field;
      });
      batchImportStatus.textContent = data.candidates.length
        ? "候选映射已填入，尚未确认；请工程师检查字段和单位。"
        : "确定性规则已覆盖字段，无需 LLM 候选。";
    }

    async function confirmImportMapping() {
      batchImportStatus.className = "status";
      try {
        const mapping = {};
        const units = {};
        importInspection.querySelectorAll("tbody tr").forEach((row) => {
          const source = row.dataset.source;
          const field = row.querySelector('[data-role="field"]').value;
          if (field) mapping[source] = field;
          const unit = row.querySelector('[data-role="unit"]').value.trim();
          if (unit) units[source] = unit;
        });
        const res = await fetch(
          `/api/projects/${currentProjectId}/batches/${currentBatchId}/imports/${currentInspection.id}/mapping`,
          {
            method: "PUT",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({mapping, units}),
          },
        );
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "确认映射失败");
        batchImportStatus.textContent = "映射已确认，标准数据已生成。";
        await loadStandardPreview();
      } catch (err) {
        batchImportStatus.className = "status error";
        batchImportStatus.textContent = err.message;
      }
    }

    async function loadStandardPreview() {
      if (!currentProjectId || !currentBatchId) return;
      const res = await fetch(`/api/projects/${currentProjectId}/batches/${currentBatchId}/standard/flow`);
      const data = await res.json();
      if (res.status === 409) {
        standardPreview.textContent = "标准数据预览尚未生成。";
        return;
      }
      if (!res.ok) throw new Error(data.detail || "读取标准数据失败");
      renderStandardPreview(data);
    }

    function renderStandardPreview(data) {
      const header = data.columns.map((column) => `<th>${escapeHtml(column)}</th>`).join("");
      const rows = data.rows.map((row) =>
        `<tr>${data.columns.map((column) => `<td>${escapeHtml(String(row[column] ?? ""))}</td>`).join("")}</tr>`
      ).join("");
      standardPreview.innerHTML = `<p><strong>标准数据预览</strong></p>
        <table><thead><tr>${header}</tr></thead><tbody>${rows}</tbody></table>`;
    }

    async function loadImportProfiles() {
      importProfileSelect.innerHTML = '<option value="">不使用配置</option>';
      if (!currentProjectId) return;
      const res = await fetch(`/api/projects/${currentProjectId}/import-profiles`);
      if (!res.ok) return;
      const profiles = await res.json();
      profiles.forEach((profile) => {
        const option = document.createElement("option");

    document.getElementById("saveImportProfile").addEventListener("click", async () => {
      const name = document.getElementById("importProfileName").value.trim();
      const sourceIdentifier = document.getElementById("importSourceIdentifier").value.trim();
      if (!currentProjectId || !currentInspection || !name || !sourceIdentifier) {
        batchImportStatus.textContent = "请填写配置名称和数据来源标识。";
        return;
      }
      const mapping = {};
      const source_units = {};
      importInspection.querySelectorAll("tbody tr").forEach((row) => {
        const field = row.querySelector('[data-role="field"]').value;
        const unit = row.querySelector('[data-role="unit"]').value.trim();
        if (field) mapping[row.dataset.source] = field;
        if (unit) source_units[row.dataset.source] = unit;

        body: JSON.stringify({
          name,
          source_identifier: sourceIdentifier,

          source_units,
          parsing_rules: {delimiter: ",", decimal: "."},
        }),
      });

      if (!res.ok) throw new Error(data.detail || "保存导入配置失败");
      await loadImportProfiles();
      importProfileSelect.value = data.id;
      batchImportStatus.textContent = "导入配置已保存，可在当前项目后续批次复用。";

    document.getElementById("batchImportForm").addEventListener("submit", async (event) => {
      event.preventDefault();

        if (!currentProjectId || !currentBatchId) throw new Error("请先选择分析批次");
        batchImportStatus.textContent = "正在上传并识别...";
        const profileQuery = importProfileSelect.value
          ? `?profile_id=${encodeURIComponent(importProfileSelect.value)}`
          : "";

          `/api/projects/${currentProjectId}/batches/${currentBatchId}/imports${profileQuery}`,
          {method: "POST", body: new FormData(event.target)},

        renderInspection(data);
        batchImportStatus.textContent = data.status === "pending_confirmation"
          ? "存在不确定项，请确认或修正映射。"
          : "识别完成，请确认映射。";

        batchImportStatus.textContent = err.message;

    });

    function jobStatusText(job) {
      if (job.status === "queued") return `排队中：${job.step}（${job.progress}%）`;
      if (job.status === "running") return `运行中：${job.step}（${job.progress}%）`;
      if (job.status === "succeeded") return "已成功：可以查看分析结果";
      return `失败：${job.error_summary || "未提供失败原因"}`;
    }

    async function loadAnalysisJobs() {
      if (!currentProjectId || !currentBatchId) return;
      const res = await fetch(
        `/api/projects/${currentProjectId}/batches/${currentBatchId}/analysis-jobs`
      );
      if (!res.ok) return;
      const jobs = await res.json();
      analysisJobHistory.innerHTML = jobs.length
        ? jobs.map((job) =>
            `<p><code>${escapeHtml(job.job_id)}</code> · ${escapeHtml(jobStatusText(job))}` +
            (job.result_url
              ? ` · <a href="${escapeHtml(job.result_url)}" target="_blank">打开结果</a>`
              : "") +
            "</p>"
          ).join("")
        : "当前批次暂无后台作业。";
    }

    async function waitForAnalysisJob(job) {
      const endpoint =
        `/api/projects/${currentProjectId}/batches/${currentBatchId}/analysis-jobs/${job.job_id}`;
      while (job.status === "queued" || job.status === "running") {
        dataQualityResult.textContent = jobStatusText(job);
        await new Promise((resolve) => setTimeout(resolve, 250));
        const res = await fetch(endpoint);
        job = await res.json();
        if (!res.ok) throw new Error(job.detail || "后台作业查询失败");
      }
      await loadAnalysisJobs();
      if (job.status === "failed") {
        throw new Error(job.error_summary || "数据质量检查失败");
      }
      const resultRes = await fetch(job.result_url);
      const result = await resultRes.json();
      if (!resultRes.ok) throw new Error(result.detail || "分析结果读取失败");
      return result;
    }

      dataQualityResult.className = "inspection";
      try {
        if (!currentProjectId || !currentBatchId) throw new Error("请先选择分析批次");
        runDataQualityButton.disabled = true;
        dataQualityResult.textContent = "正在提交后台数据质量检查...";
        const res = await fetch(
          `/api/projects/${currentProjectId}/batches/${currentBatchId}/analysis-jobs/data_quality`,
          {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
              points: [],
              force_rerun: forceDataQualityRerun.checked,
            }),
          },
        );
        const submitted = await res.json();
        if (!res.ok) throw new Error(submitted.detail || "数据质量检查提交失败");

        const rows = data.data.table.map((row) =>
          `<tr><td>${escapeHtml(String(row.point_id))}</td>` +
          `<td>${row.record_count}</td><td>${row.monitoring_days}</td>` +
          `<td>${row.theoretical_count}</td>` +
          `<td>${(row.collection_rate * 100).toFixed(1)}%</td></tr>`
        ).join("");
        const source = data.reused ? "复用已有结果" : "生成新结果";
        dataQualityResult.innerHTML =
          `<p><strong>第 ${data.version} 版</strong>（${source}）</p>` +
          "<table><thead><tr><th>点位</th><th>记录数</th><th>监测天数</th>" +
          `<th>理论记录数</th><th>收集率</th></tr></thead><tbody>${rows}</tbody></table>`;
      } catch (err) {
        dataQualityResult.className = "inspection status error";
        dataQualityResult.textContent = err.message;
      } finally {
        runDataQualityButton.disabled = !currentBatchId;

    });

    async function refreshResults() {
      const res = await fetch("/api/results");
      const data = await res.json();
      const all = [...data.outputs, ...data.workspace];
      files.innerHTML = "";
      if (all.length === 0) {
        files.textContent = "暂无结果文件。";
        return;
      }
      all.forEach((item) => {
        const a = document.createElement("a");
        a.href = `/files/${item.path}`;
        a.textContent = `${item.path} (${item.size} bytes)`;
        a.target = "_blank";
        files.appendChild(a);
      });
    }

    document.getElementById("refreshResults").addEventListener("click", refreshResults);
    restoreTranscript();
    fetch("/api/projects/selection")
      .then((response) => response.json())
      .then((data) => {
        if (data.current_project) {
          currentProjectId = data.current_project.id;
          projectStatus.textContent = `当前项目：${data.current_project.name}`;
          createBatchButton.disabled = false;
        }
        return Promise.all([refreshProjects(), refreshBatches()]);
      });
    refreshResults();
  </script>
</body>
</html>
